name: Fork validation

# Validate owned branches in neocody/openclaw-1. Inherited Blacksmith and
# privileged jobs are restricted to openclaw/openclaw in their own workflows.
# External contributor PRs are outside this fork's approved CI lane.
# The inherited Labeler was disabled in this fork with owner approval on
# 2026-10-08: it needs upstream credentials/runners and only applies labels.
# Keep all nine validation jobs below active; preserve historical Labeler runs.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    if: github.repository == 'neocody/openclaw-1' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        task: [check, tests, e2e, protocol, bun, ui]
    env:
      OPENCLAW_TEST_PROFILE: low
      OPENCLAW_TEST_WORKERS: 2
      OPENCLAW_TEST_SERIAL_GATEWAY: 1
      OPENCLAW_TEST_INCLUDE_GATEWAY: 1
      OPENCLAW_TEST_INCLUDE_EXTENSIONS: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts=false
      - name: Check, build, and smoke
        if: matrix.task == 'check'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          bad = [str(path) for pattern in ("*.yml", "*.yaml")
                 for path in sorted(Path(".github/workflows").rglob(pattern))
                 if b"\t" in path.read_bytes()]
          if bad:
              print("Tabs found in workflow files: " + ", ".join(bad))
              sys.exit(1)
          PY
          ACTIONLINT_VERSION="1.7.11"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "$base_url/$archive"
          curl -sSfL -o "$RUNNER_TEMP/actionlint-checksums.txt" "$base_url/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $archive\$" actionlint-checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
          pnpm check
          pnpm build
          pnpm build:strict-smoke
          pnpm ui:build
          node openclaw.mjs --help
          python3 scripts/check-composite-action-input-interpolation.py
      - name: All offline Node suites
        if: matrix.task == 'tests'
        run: pnpm canvas:a2ui:bundle && pnpm test
      - name: Offline end-to-end tests
        if: matrix.task == 'e2e'
        run: pnpm build && pnpm test:e2e
      - name: Protocol generation
        if: matrix.task == 'protocol'
        run: pnpm protocol:check
      - name: Browser UI tests
        if: matrix.task == 'ui'
        run: |
          pnpm --dir ui exec playwright install --with-deps chromium
          pnpm test:ui
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.task == 'bun'
        with:
          bun-version: 1.3.9
      - name: Bun compatibility tests
        if: matrix.task == 'bun'
        run: pnpm canvas:a2ui:bundle && bunx --no-install vitest run --config vitest.unit.config.ts

  python:
    if: github.repository == 'neocody/openclaw-1' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Python skill validation
        run: |
          python3 -m venv /tmp/skill-check
          /tmp/skill-check/bin/pip install pytest ruff pyyaml
          /tmp/skill-check/bin/ruff check skills
          /tmp/skill-check/bin/pytest -q skills

  macos:
    if: github.repository == 'neocody/openclaw-1' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the pinned Swift formatter
        run: |
          curl -sSfL 'https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.0/swiftformat.zip' -o "$RUNNER_TEMP/swiftformat.zip"
          echo '28c7802e11fa5ae113d903066439c6bb1be20a8ac1ad9709c42616a7e273fb0f  '"$RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat-0.63.0"
          "$RUNNER_TEMP/swiftformat-0.63.0/swiftformat" --version
      - name: Swift lint, build, and tests
        run: |
          brew install swiftlint
          swift --version
          swiftlint --config .swiftlint.yml
          "$RUNNER_TEMP/swiftformat-0.63.0/swiftformat" --lint apps/macos/Sources --config .swiftformat
          swift build --package-path apps/macos --configuration release --force-resolved-versions
          swift test --package-path apps/macos --parallel --force-resolved-versions

  android:
    if: github.repository == 'neocody/openclaw-1' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Android build and unit tests
        working-directory: apps/android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
